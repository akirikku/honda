const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const store = { get(k, d) { try { const v = localStorage.getItem("storybook." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
                set(k, v) { try { localStorage.setItem("storybook." + k, JSON.stringify(v)); } catch {} } };

function rubyHTML(segs) {
  return segs.map(([text, reading, w]) => {
    let h = reading && reading !== text ? `<ruby>${esc(text)}<rt>${esc(reading)}</rt></ruby>` : esc(text);
    if (w !== null && w !== undefined) h = `<span class="word" data-w="${w}">${h}</span>`;
    return h;
  }).join("");
}

// ---------------------------------------------------------------- header, glossary
$("title").innerHTML = rubyHTML(BOOK.title_ruby);
$("subtitle").innerHTML = rubyHTML(BOOK.subtitle_ruby);
$("title-en").textContent = `${BOOK.title_en}: ${BOOK.subtitle_en}`;
$("note").textContent = BOOK.note_en;
if (BOOK.words.length) {
  $("glossary").innerHTML = "<h2>ことば</h2><dl>" + BOOK.words.map((w) =>
    `<dt>${esc(w.word)}<small>${w.reading !== w.word ? esc(w.reading) : ""}</small></dt><dd>${esc(w.en)}</dd>`).join("") + "</dl>";
}

// ---------------------------------------------------------------- toggles
const prefs = { furigana: store.get("furigana", true), en: store.get("en", false), sound: store.get("sound", true) };
function applyPrefs() {
  document.body.classList.toggle("furigana", prefs.furigana);
  document.body.classList.toggle("show-en", prefs.en);
  $("t-furi").classList.toggle("on", prefs.furigana);
  $("t-en").classList.toggle("on", prefs.en);
  $("t-sound").classList.toggle("on", prefs.sound);
  $("t-sound").textContent = prefs.sound ? "🔊 音" : "🔇 音";
  if (bedBus) bedBus.gain.setTargetAtTime(prefs.sound ? 1 : 0, ctx.currentTime, 0.2);
  if (sfxBus) sfxBus.gain.setTargetAtTime(prefs.sound ? 1 : 0, ctx.currentTime, 0.1);
}
for (const [id, key] of [["t-furi", "furigana"], ["t-en", "en"], ["t-sound", "sound"]]) {
  $(id).onclick = () => { prefs[key] = !prefs[key]; store.set(key, prefs[key]); applyPrefs(); };
}

// ---------------------------------------------------------------- audio
// three buses: voices (straight out), ambience beds (ducked while someone speaks), effects
let ctx = null, bedBus = null, duck = null, sfxBus = null, voiceBus = null;
const buffers = new Map();
function ensureCtx() {
  if (ctx) return;
  ctx = new AudioContext();
  voiceBus = ctx.createGain(); voiceBus.connect(ctx.destination);
  duck = ctx.createGain(); duck.connect(ctx.destination);
  bedBus = ctx.createGain(); bedBus.connect(duck);
  sfxBus = ctx.createGain(); sfxBus.connect(ctx.destination);
  applyPrefs();
}
function load(url) {
  if (!buffers.has(url)) {
    buffers.set(url, fetch(url).then((r) => r.arrayBuffer()).then((b) => ctx.decodeAudioData(b)));
  }
  return buffers.get(url);
}
const dB = (x) => Math.pow(10, x / 20);

let bed = null;   // {gain, sources} of the page's ambience
async function startBed(page) {
  const layers = await Promise.all(page.ambience.map(async (a) => ({ a, buf: await load(a.src) })));
  const gain = ctx.createGain();
  gain.gain.value = 0;
  gain.connect(bedBus);
  const sources = layers.map(({ a, buf }) => {
    const src = ctx.createBufferSource(), g = ctx.createGain();
    src.buffer = buf; src.loop = true; g.gain.value = dB(a.gain);
    src.connect(g); g.connect(gain);
    src.start(ctx.currentTime, Math.random() * buf.duration * 0.5);
    return src;
  });
  gain.gain.setTargetAtTime(1, ctx.currentTime, 0.6);
  bed = { gain, sources };
}
function stopBed(fade = 0.5) {
  if (!bed) return;
  const b = bed; bed = null;
  b.gain.gain.setTargetAtTime(0, ctx.currentTime, fade / 3);
  setTimeout(() => b.sources.forEach((s) => { try { s.stop(); } catch {} }), fade * 1000 + 200);
}
function setDuck(on) { duck.gain.setTargetAtTime(on ? 0.45 : 1, ctx.currentTime, on ? 0.08 : 0.35); }

async function playEffect(fx) {
  const buf = await load(fx.src);
  const src = ctx.createBufferSource(), g = ctx.createGain();
  src.buffer = buf; g.gain.value = dB(fx.gain);
  src.connect(g); g.connect(sfxBus); src.start();
}

let voiceSrc = null;
function playVoice(url) {
  return load(url).then((buf) => new Promise((done) => {
    const src = ctx.createBufferSource();
    src.buffer = buf; src.connect(voiceBus);
    src.onended = () => { if (voiceSrc === src) voiceSrc = null; done(); };
    voiceSrc = src; setDuck(true); src.start();
  })).finally(() => setDuck(false));
}
function stopVoice() { if (voiceSrc) { const s = voiceSrc; voiceSrc = null; try { s.stop(); } catch {} } }

// ---------------------------------------------------------------- pages
let index = 0, run = 0, paused = false, started = false;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function renderPage() {
  const page = BOOK.pages[index];
  $("pic").src = page.picture;
  $("count").textContent = `${index + 1} / ${BOOK.pages.length}`;
  $("prev").disabled = index === 0;
  $("next").disabled = index === BOOK.pages.length - 1;
  let h = "";
  page.blocks.forEach((b, bi) => {
    const sents = b.sentences.map((s, si) => `<span class="s" data-b="${bi}" data-s="${si}">${rubyHTML(s.ruby)}</span>`).join("");
    if (b.type === "line") h += `<p class="line"><span class="who">${esc(BOOK.speakers[b.speaker] || b.speaker)}</span>「${sents}」</p>`;
    else h += `<p class="para">${sents}</p>`;
    if (b.en) h += `<p class="en">${esc(b.en)}</p>`;
  });
  $("story").innerHTML = h;
  // preload this page's sounds and voices, and the next picture
  if (ctx) {
    page.ambience.forEach((a) => load(a.src));
    page.blocks.forEach((b) => { b.sentences.forEach((s) => load(s.audio)); b.sfx.forEach((f) => load(f.src)); });
  }
  if (BOOK.pages[index + 1]) new Image().src = BOOK.pages[index + 1].picture;
}

function mark(bi, si) {
  document.querySelectorAll(".s.now").forEach((e) => e.classList.remove("now"));
  const el = document.querySelector(`.s[data-b="${bi}"][data-s="${si}"]`);
  if (el) { el.classList.add("now"); el.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
}

// the narrator and the characters, in order; effects fire on their sentence (+delay)
async function readPage(from = [0, 0]) {
  const me = ++run, page = BOOK.pages[index];
  if (from[0] === 0 && from[1] === 0) await sleep(1800);   // let the scene's sound settle in first
  for (let bi = from[0]; bi < page.blocks.length; bi++) {
    const b = page.blocks[bi];
    for (let si = bi === from[0] ? from[1] : 0; si < b.sentences.length; si++) {
      while (paused && me === run) await sleep(150);
      if (me !== run) return;
      mark(bi, si);
      b.sfx.filter((f) => f.sentence === si).forEach((f) => setTimeout(() => me === run && playEffect(f), f.delay * 1000));
      await playVoice(b.sentences[si].audio);
      if (me !== run) return;
      await sleep(si === b.sentences.length - 1 ? 750 : 300);
    }
  }
  mark(-1, -1);
}

async function openPage(i) {
  run++; stopVoice();
  index = i;
  stopBed(1.2);
  renderPage();
  if (started) { paused = false; updatePlay(); await startBed(BOOK.pages[index]); readPage(); }
}

function updatePlay() { $("play").textContent = paused ? "▶ 再生" : "⏸ 一時停止"; }
$("play").onclick = () => {
  if (!started) return $("start").click();
  paused = !paused; updatePlay();
  if (paused) { stopVoice(); ctx.suspend(); } else ctx.resume();
};
$("start").onclick = async () => {
  $("start").remove();
  ensureCtx(); started = true;
  await openPage(index);
};
$("prev").onclick = () => index > 0 && openPage(index - 1);
$("next").onclick = () => index < BOOK.pages.length - 1 && openPage(index + 1);
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") $("next").click();
  else if (e.key === "ArrowLeft") $("prev").click();
  else if (e.key === " ") { e.preventDefault(); $("play").click(); }
});

// tap a sentence: read on from there; tap an underlined word: its meaning
let pop = null;
$("story").addEventListener("click", (e) => {
  const w = e.target.closest(".word");
  if (pop) { pop.remove(); pop = null; }
  if (w) {   // a glossary word: show its meaning, don't jump the reading
    const word = BOOK.words[+w.dataset.w], r = w.getBoundingClientRect();
    pop = document.createElement("div");
    pop.className = "pop";
    pop.innerHTML = `<b>${esc(word.word)}</b> ${word.reading !== word.word ? esc(word.reading) : ""}<br>${esc(word.en)}`;
    document.body.appendChild(pop);
    pop.style.left = Math.max(8, Math.min(r.left, innerWidth - pop.offsetWidth - 12)) + "px";
    pop.style.top = (r.bottom + 6) + "px";
    return;
  }
  const s = e.target.closest(".s");
  if (!s || !started) return;
  stopVoice(); paused = false; updatePlay(); if (ctx.state === "suspended") ctx.resume();
  readPage([+s.dataset.b, +s.dataset.s]);
});
document.addEventListener("scroll", () => { if (pop) { pop.remove(); pop = null; } }, { passive: true });

applyPrefs();
renderPage();
</script>
</body>
</html>
